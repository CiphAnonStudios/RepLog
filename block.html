<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Juicy Cube Toy</title>

<style>
  body {
    margin: 0;
    overflow: hidden;
    background: #000;
    touch-action: none;
  }

  #ui {
    position: absolute;
    top: 20px;
    left: 20px;
    color: white;
    font-family: Arial;
    z-index: 10;
    font-size: 18px;
  }

  #crosshair {
    position: absolute;
    top: 55%;
    left: 50%;
    width: 40px;
    height: 40px;
    transform: translate(-50%, -50%);
  }

  #crosshair::before,
  #crosshair::after {
    content: "";
    position: absolute;
    background: red;
  }

  #crosshair::before {
    width: 40px;
    height: 2px;
    top: 19px;
    left: 0;
  }

  #crosshair::after {
    width: 2px;
    height: 40px;
    left: 19px;
    top: 0;
  }
</style>
</head>

<body>

<div id="ui">
  Score: <span id="score">0</span>
</div>

<div id="crosshair"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>

<script>
/* ---------------- BASIC SETUP ---------------- */
let score = 0;
const scoreEl = document.getElementById("score");

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.1, 100);
camera.position.z = 6;

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 1));

/* ---------------- CUBE ---------------- */
const cube = new THREE.Mesh(
  new THREE.BoxGeometry(1,1,1),
  new THREE.MeshStandardMaterial({ color: "orange" })
);
scene.add(cube);

/* ---------------- TARGET ---------------- */
const target = new THREE.Mesh(
  new THREE.RingGeometry(0.35, 0.5, 32),
  new THREE.MeshBasicMaterial({ color: "red" })
);
scene.add(target);

function spawnTarget() {
  target.position.set(
    (Math.random() - 0.5) * 4,
    (Math.random() - 0.5) * 2,
    0
  );
}
spawnTarget();

/* ---------------- PHYSICS ---------------- */
let vel = new THREE.Vector2();
let rot = new THREE.Vector3();
let wobble = 0;

/* ---------------- BOUNDS ---------------- */
function bounds() {
  const h = 2 * Math.tan(THREE.MathUtils.degToRad(camera.fov)/2) * camera.position.z;
  const w = h * camera.aspect;

  return {
    x: w/2 - 0.7,
    y: h/2 - 0.7
  };
}

/* ---------------- TOUCH CONTROL ---------------- */
let dragging = false;
let last = null;

window.addEventListener("pointerdown", (e) => {
  dragging = true;
  last = e;
});

window.addEventListener("pointermove", (e) => {
  if (!dragging) return;

  const dx = e.clientX - last.clientX;
  const dy = e.clientY - last.clientY;

  /* JUICY FORCE (this is what makes it fun) */
  vel.x += dx * 0.004;
  vel.y -= dy * 0.004;

  /* SPIN / FLIP */
  rot.y += dx * 0.03;
  rot.x += dy * 0.03;
  rot.z += dx * 0.01;

  last = e;
});

window.addEventListener("pointerup", () => {
  dragging = false;
});

/* ---------------- LOOP ---------------- */
function animate() {
  requestAnimationFrame(animate);

  /* gravity */
  if (!dragging) vel.y -= 0.008;

  /* motion smoothing */
  vel.multiplyScalar(0.95);

  cube.position.x += vel.x;
  cube.position.y += vel.y;

  /* rotation */
  cube.rotation.x += rot.x;
  cube.rotation.y += rot.y;
  cube.rotation.z += rot.z;

  rot.multiplyScalar(0.9);

  /* SUPER JUICY WOBBLE */
  wobble += vel.length() * 0.4;
  const s = Math.sin(wobble) * 0.1;

  cube.scale.x = 1 + s;
  cube.scale.y = 1 - s;
  cube.scale.z = 1 + s * 0.6;

  /* bounds bounce (FEELS GOOD NOT REALISTIC) */
  const b = bounds();

  if (cube.position.x > b.x) {
    cube.position.x = b.x;
    vel.x *= -1.1;
  }
  if (cube.position.x < -b.x) {
    cube.position.x = -b.x;
    vel.x *= -1.1;
  }

  if (cube.position.y > b.y) {
    cube.position.y = b.y;
    vel.y *= -1.1;
  }
  if (cube.position.y < -b.y) {
    cube.position.y = -b.y;
    vel.y *= -1.1;
  }

  /* SCORE */
  if (cube.position.distanceTo(target.position) < 0.8) {
    score++;
    scoreEl.innerText = score;

    spawnTarget();

    /* hit pop */
    cube.scale.set(1.4, 0.6, 1.4);
    setTimeout(() => cube.scale.set(1,1,1), 90);
  }

  renderer.render(scene, camera);
}

animate();

/* resize */
window.addEventListener("resize", () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>

</body>
</html>
