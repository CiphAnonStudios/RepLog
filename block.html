<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Cube Core Fix</title>

<style>
  body {
    margin: 0;
    overflow: hidden;
    background: black;
    touch-action: none;
  }

  #ui {
    position: absolute;
    top: 20px;
    left: 20px;
    color: white;
    font-family: Arial;
    z-index: 10;
  }

  #crosshair {
    position: absolute;
    top: 55%;
    left: 50%;
    width: 40px;
    height: 40px;
    transform: translate(-50%, -50%);
  }

  #crosshair::before,
  #crosshair::after {
    content: "";
    position: absolute;
    background: red;
  }

  #crosshair::before {
    width: 40px;
    height: 2px;
    top: 19px;
    left: 0;
  }

  #crosshair::after {
    width: 2px;
    height: 40px;
    left: 19px;
    top: 0;
  }
</style>
</head>

<body>

<div id="ui">
  <div id="score">Score: 0</div>
</div>

<div id="crosshair"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>

<script>
/* ---------------- BASIC SETUP ---------------- */
let score = 0;
const scoreEl = document.getElementById("score");

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.1, 100);
camera.position.z = 6;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 1));

/* ---------------- CUBE ---------------- */
const cube = new THREE.Mesh(
  new THREE.BoxGeometry(1,1,1),
  new THREE.MeshStandardMaterial({ color: "orange" })
);
scene.add(cube);

/* ---------------- TARGET ---------------- */
const target = new THREE.Mesh(
  new THREE.RingGeometry(0.35, 0.5, 32),
  new THREE.MeshBasicMaterial({ color: "red" })
);
scene.add(target);

function spawnTarget() {
  target.position.set(
    (Math.random() - 0.5) * 4,
    (Math.random() - 0.5) * 2,
    0
  );
}
spawnTarget();

/* ---------------- PHYSICS ---------------- */
let vel = new THREE.Vector2();
let rotVel = new THREE.Vector3();
let wobble = 0;

/* ---------------- BOUNDS ---------------- */
function getBounds() {
  const vFOV = THREE.MathUtils.degToRad(camera.fov);
  const height = 2 * Math.tan(vFOV / 2) * camera.position.z;
  const width = height * camera.aspect;

  return {
    x: width / 2 - 0.7,
    y: height / 2 - 0.7
  };
}

/* ---------------- TOUCH (FIXED CORE FEEL) ---------------- */
let dragging = false;
let last = null;

window.addEventListener("pointerdown", (e) => {
  dragging = true;
  last = e;
});

window.addEventListener("pointermove", (e) => {
  if (!dragging) return;

  const dx = e.clientX - last.clientX;
  const dy = e.clientY - last.clientY;

  /* REAL PUSH FEEL */
  vel.x += dx * 0.0022;
  vel.y -= dy * 0.0022;

  /* FLIP / FLOP ROTATION */
  rotVel.y += dx * 0.02;
  rotVel.x += dy * 0.02;

  last = e;
});

window.addEventListener("pointerup", () => {
  dragging = false;
});

/* ---------------- LOOP ---------------- */
function animate() {
  requestAnimationFrame(animate);

  /* gravity */
  if (!dragging) vel.y -= 0.012;

  /* smooth movement */
  vel.multiplyScalar(0.93);

  cube.position.x += vel.x;
  cube.position.y += vel.y;

  /* rotation */
  cube.rotation.x += rotVel.x;
  cube.rotation.y += rotVel.y;
  cube.rotation.z += rotVel.z;
  rotVel.multiplyScalar(0.88);

  /* simple jelly feel (stable version) */
  wobble += 0.2;
  const s = Math.sin(wobble) * 0.06;

  cube.scale.x = 1 + s;
  cube.scale.y = 1 - s;
  cube.scale.z = 1 + s * 0.5;

  /* screen bounds (clean + stable) */
  const b = getBounds();

  cube.position.x = Math.max(-b.x, Math.min(b.x, cube.position.x));
  cube.position.y = Math.max(-b.y, Math.min(b.y, cube.position.y));

  /* collision */
  if (cube.position.distanceTo(target.position) < 0.8) {
    score++;
    spawnTarget();
  }

  scoreEl.innerText = "Score: " + score;

  renderer.render(scene, camera);
}

animate();

/* resize */
window.addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>

</body>
</html>
