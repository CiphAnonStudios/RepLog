<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Bounded Cube Game</title>

<style>
  body { margin:0; overflow:hidden; background:#000; }

  #ui {
    position:absolute;
    top:20px;
    left:20px;
    color:white;
    font-family:Arial;
    z-index:10;
  }

  button {
    margin-top:8px;
    padding:8px;
    background:#111;
    color:white;
    border:1px solid #333;
  }

  #crosshair {
    position:absolute;
    top:55%;
    left:50%;
    width:40px;
    height:40px;
    transform:translate(-50%,-50%);
    z-index:5;
  }

  #crosshair:before, #crosshair:after {
    content:"";
    position:absolute;
    background:red;
  }

  #crosshair:before {
    width:40px; height:2px; top:19px; left:0;
  }

  #crosshair:after {
    width:2px; height:40px; left:19px; top:0;
  }

  #settings {
    position:absolute;
    right:20px;
    top:20px;
    background:#000000cc;
    padding:10px;
    color:white;
    display:none;
  }
</style>
</head>

<body>

<div id="ui">
  <div id="score">Score: 0</div>
  <button onclick="toggleSettings()">Settings</button>
</div>

<div id="crosshair"></div>

<div id="settings">
  <button onclick="toggleTilt()">Screen Rotate: <span id="tiltState">OFF</span></button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>

<script>
/* ---------------- SAVE ---------------- */
let save = JSON.parse(localStorage.getItem("cubeGame")) || { score: 0 };
let score = save.score;

/* ---------------- UI ---------------- */
const scoreEl = document.getElementById("score");
const tiltState = document.getElementById("tiltState");
const settings = document.getElementById("settings");

/* ---------------- SCENE ---------------- */
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.1, 100);
camera.position.z = 6;

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff,1));

/* ---------------- CUBE ---------------- */
const cube = new THREE.Mesh(
  new THREE.BoxGeometry(1,1,1),
  new THREE.MeshStandardMaterial({ color:"orange" })
);
scene.add(cube);

/* ---------------- TARGET ---------------- */
const target = new THREE.Mesh(
  new THREE.RingGeometry(0.35,0.5,32),
  new THREE.MeshBasicMaterial({ color:"red" })
);
scene.add(target);

function randomTarget(){
  target.position.set(
    (Math.random()-0.5)*4,
    (Math.random()-0.5)*2,
    (Math.random()-0.5)*3
  );
}
randomTarget();

/* ---------------- PHYSICS ---------------- */
let vel = new THREE.Vector3();
let wobble = 0;

/* ---------------- CAMERA BOUNDS (IMPORTANT FIX) ---------------- */
/*
We compute visible world bounds at cube depth so it NEVER leaves screen.
*/
function getBounds(){
  const vFOV = THREE.MathUtils.degToRad(camera.fov);
  const height = 2 * Math.tan(vFOV / 2) * camera.position.z;
  const width = height * camera.aspect;

  return {
    x: width / 2 - 0.6,
    y: height / 2 - 0.6
  };
}

/* ---------------- TILT ---------------- */
let tiltEnabled = false;

function toggleTilt(){
  tiltEnabled = !tiltEnabled;
  tiltState.innerText = tiltEnabled ? "ON" : "OFF";
}

window.addEventListener("deviceorientation", (e)=>{
  if(!tiltEnabled) return;

  vel.x += (e.gamma || 0) * 0.0006;
  vel.z += (e.beta || 0) * 0.0006;
});

/* ---------------- SETTINGS ---------------- */
function toggleSettings(){
  settings.style.display = settings.style.display === "block" ? "none" : "block";
}

/* ---------------- TOUCH FLING ---------------- */
let dragging = false;
let last = null;

window.addEventListener("pointerdown", (e)=>{
  dragging = true;
  last = e;
});

window.addEventListener("pointermove", (e)=>{
  if(!dragging) return;

  const dx = e.clientX - last.clientX;
  const dy = e.clientY - last.clientY;

  vel.x += dx * 0.0018;
  vel.y -= dy * 0.0018;

  last = e;
});

window.addEventListener("pointerup", ()=>{
  dragging = false;
});

/* ---------------- GAME LOOP ---------------- */
function animate(){
  requestAnimationFrame(animate);

  vel.y -= 0.012;
  cube.position.add(vel);
  vel.multiplyScalar(0.97);

  /* ---------------- 🔒 HARD PHONE BOUNDS ---------------- */
  const b = getBounds();

  if(cube.position.x > b.x){ cube.position.x = b.x; vel.x *= -0.6; }
  if(cube.position.x < -b.x){ cube.position.x = -b.x; vel.x *= -0.6; }

  if(cube.position.y > b.y){ cube.position.y = b.y; vel.y *= -0.6; }
  if(cube.position.y < -b.y){ cube.position.y = -b.y; vel.y *= -0.6; }

  /* Z clamp (depth safety) */
  if(cube.position.z > 3){ cube.position.z = 3; vel.z *= -0.6; }
  if(cube.position.z < -3){ cube.position.z = -3; vel.z *= -0.6; }

  /* jelly wobble */
  wobble += 0.2;
  const s = Math.sin(wobble) * 0.08;

  cube.scale.x = 1 + s;
  cube.scale.y = 1 - s;
  cube.scale.z = 1 + s * 0.6;

  /* target hit */
  if(cube.position.distanceTo(target.position) < 0.8){
    score++;
    save.score = score;
    localStorage.setItem("cubeGame", JSON.stringify(save));

    randomTarget();
  }

  scoreEl.innerText = "Score: " + score;

  renderer.render(scene,camera);
}
animate();

/* resize */
window.addEventListener("resize", ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>

</body>
</html>
