<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Cube Toy Physics</title>

<style>
  body {
    margin: 0;
    overflow: hidden;
    background: black;
  }

  #ui {
    position: absolute;
    top: 20px;
    left: 20px;
    color: white;
    font-family: Arial;
    z-index: 10;
  }

  #score {
    font-size: 18px;
  }

  #crosshair {
    position: absolute;
    top: 55%;
    left: 50%;
    width: 40px;
    height: 40px;
    transform: translate(-50%, -50%);
    z-index: 5;
  }

  #crosshair::before,
  #crosshair::after {
    content: "";
    position: absolute;
    background: red;
  }

  #crosshair::before {
    width: 40px;
    height: 2px;
    top: 19px;
    left: 0;
  }

  #crosshair::after {
    width: 2px;
    height: 40px;
    top: 0;
    left: 19px;
  }
</style>
</head>

<body>

<div id="ui">
  <div id="score">Score: 0</div>
</div>

<div id="crosshair"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>

<script>
/* ---------------- SAVE ---------------- */
let save = JSON.parse(localStorage.getItem("cubeGame")) || { score: 0 };
let score = save.score;

const scoreEl = document.getElementById("score");

/* ---------------- SCENE ---------------- */
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  70,
  innerWidth / innerHeight,
  0.1,
  100
);
camera.position.z = 6;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 1));

/* ---------------- CUBE ---------------- */
const cube = new THREE.Mesh(
  new THREE.BoxGeometry(1, 1, 1),
  new THREE.MeshStandardMaterial({ color: "orange" })
);
scene.add(cube);

/* ---------------- TARGET ---------------- */
const target = new THREE.Mesh(
  new THREE.RingGeometry(0.35, 0.5, 32),
  new THREE.MeshBasicMaterial({ color: "red" })
);
scene.add(target);

function spawnTarget() {
  target.position.set(
    (Math.random() - 0.5) * 4,
    (Math.random() - 0.5) * 2,
    0
  );
}
spawnTarget();

/* ---------------- PHYSICS ---------------- */
let vel = new THREE.Vector2();
let rotVel = new THREE.Vector3();
let wobble = 0;

/* ---------------- BOUNDS ---------------- */
function getBounds() {
  const vFOV = THREE.MathUtils.degToRad(camera.fov);
  const height = 2 * Math.tan(vFOV / 2) * camera.position.z;
  const width = height * camera.aspect;

  return {
    x: width / 2 - 0.7,
    y: height / 2 - 0.7
  };
}

/* ---------------- TOUCH GRAB SYSTEM ---------------- */
let dragging = false;
let grabOffset = new THREE.Vector2();

window.addEventListener("pointerdown", (e) => {
  dragging = true;

  const nx = (e.clientX / innerWidth) * 2 - 1;
  const ny = -(e.clientY / innerHeight) * 2 + 1;

  grabOffset.set(
    cube.position.x - nx * 4,
    cube.position.y - ny * 3
  );
});

window.addEventListener("pointermove", (e) => {
  if (!dragging) return;

  const nx = (e.clientX / innerWidth) * 2 - 1;
  const ny = -(e.clientY / innerHeight) * 2 + 1;

  const tx = nx * 4 + grabOffset.x;
  const ty = ny * 3 + grabOffset.y;

  /* smooth follow (important for feel) */
  vel.x = (tx - cube.position.x) * 0.3;
  vel.y = (ty - cube.position.y) * 0.3;

  /* spin from movement */
  rotVel.y += vel.x * 0.15;
  rotVel.x += vel.y * 0.15;
});

window.addEventListener("pointerup", () => {
  dragging = false;
});

/* ---------------- LOOP ---------------- */
function animate() {
  requestAnimationFrame(animate);

  /* gravity */
  if (!dragging) {
    vel.y -= 0.012;
    vel.multiplyScalar(0.92);
  }

  cube.position.x += vel.x;
  cube.position.y += vel.y;

  /* rotation (flop feel) */
  cube.rotation.x += rotVel.x;
  cube.rotation.y += rotVel.y;
  cube.rotation.z += rotVel.z;
  rotVel.multiplyScalar(0.85);

  /* jelly squash */
  wobble += 0.2;
  const s = Math.sin(wobble) * 0.08;

  cube.scale.x = 1 + s;
  cube.scale.y = 1 - s;
  cube.scale.z = 1 + s * 0.6;

  /* screen lock */
  const b = getBounds();

  cube.position.x = Math.max(-b.x, Math.min(b.x, cube.position.x));
  cube.position.y = Math.max(-b.y, Math.min(b.y, cube.position.y));

  /* collision */
  if (cube.position.distanceTo(target.position) < 0.8) {
    score++;
    save.score = score;
    localStorage.setItem("cubeGame", JSON.stringify(save));
    spawnTarget();
  }

  scoreEl.innerText = "Score: " + score;

  renderer.render(scene, camera);
}

animate();

/* resize */
window.addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>

</body>
</html>
