<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>RepLog</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

:root{
  --bg:#0f0a07;
  --card:rgba(255,255,255,0.06);
  --stroke:rgba(255,255,255,0.08);
  --text:#ffffff;
  --muted:rgba(255,255,255,0.65);
  --accent:#d6a15f;
  --accent2:#8f5cff;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Poppins,sans-serif;
  background:
    radial-gradient(circle at top left,#2a1a12,#0b0705 60%);
  color:var(--text);
  overflow-x:hidden;
  padding-bottom:90px;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 20% 20%, rgba(214,161,95,0.10), transparent 40%),
    radial-gradient(circle at 80% 30%, rgba(143,92,255,0.10), transparent 35%);
  z-index:-1;
}

/* NAV */
nav{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:18px;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:20px;
  font-weight:700;
  color:var(--accent);
}

.logo img{
  width:38px;
  height:38px;
  border-radius:12px;
}

.menu-btn{
  font-size:22px;
  color:white;
}

/* HERO */
.hero{
  padding:10px 20px 40px;
}

.hero-card{
  background:linear-gradient(145deg,
    rgba(255,255,255,0.08),
    rgba(255,255,255,0.03));

  border:1px solid var(--stroke);
  border-radius:28px;
  padding:28px 22px;
  position:relative;
  overflow:hidden;
}

.hero h1{
  font-size:42px;
}

.hero h1 span{
  color:var(--accent);
}

.hero p{
  color:var(--muted);
  font-size:15px;
  max-width:300px;
}

/* STATS */
.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  padding:0 20px;
  margin-top:-15px;
}

.stat-card{
  background:var(--card);
  border:1px solid var(--stroke);
  border-radius:20px;
  padding:18px 12px;
  text-align:center;
  backdrop-filter:blur(12px);
}

.stat-card h2{
  color:var(--accent);
  font-size:22px;
}

.stat-card p{
  color:var(--muted);
  font-size:12px;
}

/* SECTION */
.section{
  padding:35px 20px 0;
}

/* CHALLENGES */
.challenge-card{
  background:linear-gradient(
    145deg,
    rgba(255,255,255,0.08),
    rgba(255,255,255,0.03)
  );
  border:1px solid var(--stroke);
  border-radius:24px;
  padding:20px;
  margin-bottom:16px;
}

/* COMING SOON */
.coming-banner{
  margin:55px 20px 20px;
  border-radius:30px;

  background:
    linear-gradient(145deg,
      rgba(143,92,255,0.30),
      rgba(74,0,224,0.18),
      rgba(255,255,255,0.04)
    );

  border:1px solid rgba(143,92,255,0.25);
  padding:34px 24px;
  position:relative;
  overflow:hidden;
}

/* SOCIALS */
.social-section{
  padding:18px 20px;
}

.social-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.social-card{
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:22px;
  padding:18px;
  text-decoration:none;
  color:white;
}

/* BOTTOM NAV */
.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:rgba(10,10,10,0.92);
  backdrop-filter:blur(20px);
  border-top:1px solid var(--stroke);
  display:flex;
  justify-content:space-around;
  padding:12px 0;
}

.bottom-nav a{
  color:var(--muted);
  text-decoration:none;
  display:flex;
  flex-direction:column;
  align-items:center;
  font-size:11px;
}

.bottom-nav a.active{
  color:var(--accent);
}

</style>
</head>

<body>

<nav>
  <div class="logo">
    <img src="RepLogHeader.png">
    <span>RepLog</span>
  </div>
</nav>

<section class="hero">
  <div class="hero-card">
    <h1>Build Your <span>Colony</span></h1>
    <p>Complete challenges, earn XP, unlock ants.</p>
  </div>
</section>

<!-- STATS (UPDATED WITH DATA TARGETS) -->
<section class="stats">

  <div class="stat-card">
    <h2 class="count" data-target="12">0</h2>
    <p>LEVEL</p>
  </div>

  <div class="stat-card">
    <h2 class="count" data-target="4">0</h2>
    <p>ANTS</p>
  </div>

  <div class="stat-card">
    <h2 class="count" data-target="89">0</h2>
    <p>STREAK</p>
  </div>

</section>

<!-- COMING SOON -->
<section class="coming-banner">
  <h2>Workout Generator</h2>
  <p>Coming soon system upgrade.</p>
</section>

<!-- SOCIALS -->
<section class="social-section">

  <div class="social-grid">

    <div class="social-card">TikTok</div>
    <div class="social-card">YouTube</div>
    <div class="social-card">Discord</div>
    <div class="social-card">Instagram</div>

  </div>

</section>

<!-- BOTTOM NAV -->
<div class="bottom-nav">

  <a class="active" href="#">
    <i class="fa-solid fa-house"></i>
    Home
  </a>

  <a href="#">
    <i class="fa-solid fa-dumbbell"></i>
    Push
  </a>

  <a href="#">
    <i class="fa-solid fa-fire"></i>
    Core
  </a>

  <a href="#">
    <i class="fa-solid fa-bolt"></i>
    Cardio
  </a>

</div>

<!-- COUNT UP SCRIPT -->
<script>
document.addEventListener("DOMContentLoaded", () => {

  const counters = document.querySelectorAll(".count");

  counters.forEach(counter => {
    const target = +counter.getAttribute("data-target");
    let count = 0;

    const speed = target / 60; // animation speed

    function update(){
      count += speed;

      if(count < target){
        counter.innerText = Math.floor(count);
        requestAnimationFrame(update);
      } else {
        counter.innerText = target;
      }
    }

    update();
  });

});
</script>

</body>
</html>
