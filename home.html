<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>RepLog</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

:root{
  --bg:#0f0a07;
  --card:rgba(255,255,255,0.06);
  --stroke:rgba(255,255,255,0.08);
  --text:#ffffff;
  --muted:rgba(255,255,255,0.65);
  --accent:#d6a15f;
  --accent2:#8f5cff;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:Poppins,sans-serif;
  background:radial-gradient(circle at top left,#2a1a12,#0b0705 60%);
  color:var(--text);
  overflow-x:hidden;
  padding-bottom:90px;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 20% 20%, rgba(214,161,95,0.10), transparent 40%),
    radial-gradient(circle at 80% 30%, rgba(143,92,255,0.10), transparent 35%);
  z-index:-1;
}

/* NAV */
nav{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:18px;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:20px;
  font-weight:700;
  color:var(--accent);
}

.logo img{width:38px;height:38px;border-radius:12px;}
.menu-btn{font-size:22px;color:white;}

/* HERO */
.hero{padding:10px 20px 40px;}

.hero-card{
  background:linear-gradient(145deg,rgba(255,255,255,0.08),rgba(255,255,255,0.03));
  border:1px solid var(--stroke);
  border-radius:32px;
  padding:30px 24px;
  position:relative;
  overflow:hidden;
}

.hero h1{font-size:46px;font-weight:800;}
.hero h1 span{color:var(--accent);}
.hero p{color:var(--muted);font-size:15px;line-height:1.6;}

.hero-buttons{display:flex;gap:12px;margin-top:28px;}

.hero-btn{
  flex:1;
  text-align:center;
  padding:15px;
  border-radius:18px;
  text-decoration:none;
  font-weight:700;
}

.primary{background:linear-gradient(135deg,#d6a15f,#ffcb7d);color:black;}
.secondary{background:rgba(255,255,255,0.07);color:white;border:1px solid var(--stroke);}

/* STATS */
.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
  padding:0 20px;
}

.stat-card{
  background:rgba(255,255,255,0.07);
  border:1px solid var(--stroke);
  border-radius:22px;
  padding:20px 12px;
  text-align:center;
}

.stat-card h2{color:var(--accent);font-size:24px;font-weight:800;}
.stat-card p{color:var(--muted);font-size:12px;}

/* CHALLENGES (unchanged) */
.section{padding:38px 20px 0;}
.section-title{display:flex;justify-content:space-between;margin-bottom:18px;}
.challenge-grid{display:flex;flex-direction:column;gap:18px;}

/* =========================
   DIFFICULTY SECTION (NEW)
========================= */

.difficulty-wrap{
  padding:40px 20px;
}

.difficulty-card{
  background:linear-gradient(145deg,rgba(255,255,255,0.08),rgba(255,255,255,0.03));
  border:1px solid var(--stroke);
  border-radius:30px;
  padding:22px;
}

.difficulty-title h2{
  font-size:24px;
}

.difficulty-title p{
  color:var(--muted);
  font-size:13px;
  margin-bottom:18px;
}

.difficulty-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px;
  margin:10px 0;
  border-radius:16px;
  background:rgba(255,255,255,0.04);
}

.stars i{
  margin-left:4px;
  transform:translateX(-25px);
  opacity:0;
  transition:0.5s ease;
}

/* COLORS */
.beginner i{color:#2ecc71;}
.intermediate i{color:#f1c40f;}
.professional i{color:#e74c3c;}
.intense i{color:#8e44ad;}
.elite i{color:#2c3e50;}

/* ANIMATION */
.difficulty-card.active .stars i{
  transform:translateX(0);
  opacity:1;
}

.difficulty-card.active .stars i:nth-child(1){transition-delay:0.05s;}
.difficulty-card.active .stars i:nth-child(2){transition-delay:0.1s;}
.difficulty-card.active .stars i:nth-child(3){transition-delay:0.15s;}
.difficulty-card.active .stars i:nth-child(4){transition-delay:0.2s;}
.difficulty-card.active .stars i:nth-child(5){transition-delay:0.25s;}

/* FOOTER */
footer{
  text-align:center;
  color:rgba(255,255,255,0.35);
  padding:35px 20px;
  font-size:12px;
}

</style>
</head>

<body>

<nav>
  <div class="logo">
    <img src="RepLogHeader.png">
    <span>RepLog</span>
  </div>
  <div class="menu-btn"><i class="fa-solid fa-bars"></i></div>
</nav>

<!-- HERO + STATS (your original content stays unchanged) -->

<section class="hero">
  <div class="hero-card">
    <h1>Build Your <span>Colony</span></h1>
    <p>Complete challenges, earn XP, unlock ants.</p>
  </div>
</section>

<section class="stats">
  <div class="stat-card"><h2>12</h2><p>LEVEL</p></div>
  <div class="stat-card"><h2>4</h2><p>ANTS</p></div>
  <div class="stat-card"><h2>89%</h2><p>STREAK</p></div>
</section>

<!-- CHALLENGES stays same -->
<!-- (your full challenge section remains exactly as you had it) -->

<!-- 🔥 DIFFICULTY LEVELS ADDED HERE -->
<section class="difficulty-wrap">
  <div class="difficulty-card">

    <div class="difficulty-title">
      <h2>Difficulty Levels</h2>
      <p>Scroll to reveal progression</p>
    </div>

    <div class="difficulty-row beginner">
      <span>Beginner</span>
      <div class="stars"><i class="fa-solid fa-star"></i></div>
    </div>

    <div class="difficulty-row intermediate">
      <span>Intermediate</span>
      <div class="stars">
        <i class="fa-solid fa-star"></i>
        <i class="fa-solid fa-star"></i>
      </div>
    </div>

    <div class="difficulty-row professional">
      <span>Professional</span>
      <div class="stars">
        <i class="fa-solid fa-star"></i>
        <i class="fa-solid fa-star"></i>
        <i class="fa-solid fa-star"></i>
      </div>
    </div>

    <div class="difficulty-row intense">
      <span>Intense</span>
      <div class="stars">
        <i class="fa-solid fa-star"></i>
        <i class="fa-solid fa-star"></i>
        <i class="fa-solid fa-star"></i>
        <i class="fa-solid fa-star"></i>
      </div>
    </div>

    <div class="difficulty-row elite">
      <span>Elite</span>
      <div class="stars">
        <i class="fa-solid fa-star"></i>
        <i class="fa-solid fa-star"></i>
        <i class="fa-solid fa-star"></i>
        <i class="fa-solid fa-star"></i>
        <i class="fa-solid fa-star"></i>
      </div>
    </div>

  </div>
</section>

<footer>
  RepLog • Colony Training System
</footer>

<script>
const card = document.querySelector(".difficulty-card");

const obs = new IntersectionObserver((entries)=>{
  entries.forEach(e=>{
    if(e.isIntersecting){
      card.classList.add("active");
    } else {
      card.classList.remove("active");
    }
  });
},{threshold:0.4});

obs.observe(card);
</script>

</body>
</html>
