<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>RepLog - Push Challenge</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

:root{
  --bg:#0f0a07;
  --card:rgba(255,255,255,0.06);
  --stroke:rgba(255,255,255,0.08);
  --text:#ffffff;
  --muted:rgba(255,255,255,0.65);
  --accent:#d6a15f;
  --accent2:#8f5cff;
  --green:#22c55e;
  --purple:#a855f7;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Poppins,sans-serif;
  background:
  radial-gradient(circle at top left,#2a1a12,#0b0705 60%);
  color:var(--text);
  overflow-x:hidden;
  padding-bottom:100px;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 20% 20%, rgba(214,161,95,0.10), transparent 40%),
    radial-gradient(circle at 80% 30%, rgba(143,92,255,0.10), transparent 35%);
  z-index:-1;
}

/* NAV */

nav{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:18px;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:20px;
  font-weight:700;
  color:var(--accent);
}

.logo img{
  width:38px;
  height:38px;
  border-radius:12px;
}

.menu-btn{
  font-size:22px;
  color:white;
}

/* STATS */

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  padding:0 20px;
}

.stat-card{
  background:var(--card);
  border:1px solid var(--stroke);
  border-radius:20px;
  padding:18px 12px;
  text-align:center;
  backdrop-filter:blur(12px);
}

.stat-card h2{
  color:var(--accent);
  font-size:22px;
}

.stat-card p{
  color:var(--muted);
  font-size:12px;
}

/* MONTH */

#month{
  padding:25px 20px 10px;
  font-size:22px;
  font-weight:700;
}

/* CALENDAR */

#calendar{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:8px;
  padding:0 20px 10px;
}

.day-name{
  text-align:center;
  color:var(--muted);
  font-size:11px;
  padding-bottom:5px;
}

.day{
  aspect-ratio:1;
  border-radius:16px;
  background:var(--card);
  border:1px solid var(--stroke);

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:13px;

  backdrop-filter:blur(12px);

  transition:0.2s;
}

.day:hover{
  transform:scale(1.06);
}

.today{
  border:1px solid var(--green);
}

.done{
  background:var(--green);
  color:black;
  font-weight:700;
}

.multi{
  background:var(--purple);
  color:white;
  font-weight:700;
}

/* MAIN CARD */

.challenge-card{
  margin:16px 20px;

  background:linear-gradient(
  145deg,
  rgba(255,255,255,0.08),
  rgba(255,255,255,0.03));

  border:1px solid var(--stroke);

  border-radius:28px;

  padding:24px;

  position:relative;
  overflow:hidden;
}

.challenge-card::before{
  content:"";
  position:absolute;
  width:220px;
  height:220px;
  background:rgba(255,153,102,0.12);
  border-radius:50%;
  top:-120px;
  right:-80px;
}

.challenge-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.challenge-icon{
  width:60px;
  height:60px;
  border-radius:18px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:linear-gradient(135deg,#ff9966,#ff5e62);

  font-size:24px;
}

.challenge-level{
  background:rgba(255,255,255,0.08);
  border:1px solid var(--stroke);

  padding:8px 12px;

  border-radius:12px;

  color:var(--muted);
  font-size:12px;
}

/* CIRCLE */

.circle{
  width:180px;
  height:180px;
  border-radius:50%;
  margin:25px auto;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
  conic-gradient(var(--green) 0deg,#1e293b 0deg);

  transition:0.5s ease;
}

.inner{
  width:130px;
  height:130px;
  border-radius:50%;

  background:rgba(0,0,0,0.35);

  border:1px solid var(--stroke);

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:22px;
  font-weight:700;

  backdrop-filter:blur(10px);
}

/* TEXT */

.exercise{
  font-size:24px;
  font-weight:700;
  text-align:center;
}

.reps{
  margin-top:8px;
  text-align:center;
  color:var(--muted);
}

.setinfo{
  margin-top:4px;
  text-align:center;
  color:var(--muted);
  font-size:13px;
}

/* BUTTONS */

button{
  width:100%;
  padding:15px;
  border:none;
  border-radius:16px;

  font-weight:700;
  font-size:15px;

  cursor:pointer;

  margin-top:12px;

  transition:0.25s;
}

button:hover{
  transform:translateY(-2px);
}

.primary-btn{
  background:var(--green);
  color:white;
}

.secondary-btn{
  background:rgba(255,255,255,0.07);
  color:white;
  border:1px solid var(--stroke);
}

/* INFO CARD */

.info-card{
  margin:0 20px;
  padding:22px;

  border-radius:24px;

  background:linear-gradient(
  145deg,
  rgba(255,255,255,0.08),
  rgba(255,255,255,0.03));

  border:1px solid var(--stroke);

  color:var(--muted);

  line-height:1.8;
  font-size:14px;
}

/* FOOTER */

footer{
  text-align:center;
  color:rgba(255,255,255,0.35);
  padding:30px 20px;
  font-size:12px;
}

/* BOTTOM NAV */

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;

  background:rgba(10,10,10,0.92);

  backdrop-filter:blur(20px);

  border-top:1px solid var(--stroke);

  display:flex;
  justify-content:space-around;

  padding:12px 0;

  z-index:999;
}

.bottom-nav a{
  color:var(--muted);
  text-decoration:none;

  display:flex;
  flex-direction:column;
  align-items:center;

  gap:5px;

  font-size:11px;
}

.bottom-nav i{
  font-size:20px;
}

.bottom-nav a.active{
  color:var(--accent);
}

</style>
</head>

<body>

<!-- NAV -->

<nav>
  <div class="logo">
    <img src="RepLogHeader.png">
    <span>RepLog</span>
  </div>

  <div class="menu-btn">
    <i class="fa-solid fa-bars"></i>
  </div>
</nav>

<!-- STATS -->

<section class="stats">

  <div class="stat-card">
    <h2 id="xp">0</h2>
    <p>XP</p>
  </div>

  <div class="stat-card">
    <h2 id="level">1</h2>
    <p>LEVEL</p>
  </div>

  <div class="stat-card">
    <h2 id="streak">0</h2>
    <p>STREAK</p>
  </div>

</section>

<!-- CALENDAR -->

<div id="month"></div>
<div id="calendar"></div>

<!-- CHALLENGE -->

<div class="challenge-card">

  <div class="challenge-top">

    <div class="challenge-icon">
      <i class="fa-solid fa-dumbbell"></i>
    </div>

    <div class="challenge-level">
      Beginner
    </div>

  </div>

  <div class="circle" id="circle">
    <div class="inner" id="percent">0/100</div>
  </div>

  <div class="exercise" id="exercise">Ready?</div>
  <div class="reps" id="reps"></div>
  <div class="setinfo" id="setinfo"></div>

  <button class="primary-btn" id="btn">
    Complete Set
  </button>

  <button class="secondary-btn" id="resetBtn">
    Reset Workout
  </button>

</div>

<!-- INFO -->

<div class="info-card">
  green = completed once (100 reps)<br>
  purple = completed multiple times
</div>

<footer>
RepLog • Push Challenge [V1.0.0]
</footer>

<!-- BOTTOM NAV -->

<div class="bottom-nav">

  <a href="index.html">
    <i class="fa-solid fa-house"></i>
    Home
  </a>

  <a class="active" href="#">
    <i class="fa-solid fa-dumbbell"></i>
    Push
  </a>

  <a href="CoreChallenge.html">
    <i class="fa-solid fa-fire"></i>
    Core
  </a>

  <a href="CardioChallenge.html">
    <i class="fa-solid fa-bolt"></i>
    Cardio
  </a>

  <a href="profile.html">
    <i class="fa-solid fa-user"></i>
    Profile
  </a>

</div>

<script>

document.addEventListener("DOMContentLoaded",()=>{

const workout=[
["Normal Push-ups",10],
["Wide Push-ups",10],
["Diamond Push-ups",10],
["Reverse Push-ups",10],
["Pike Push-ups",10],
["Decline Push-ups",10],
["Archer Push-ups",10],
["Explosive Push-ups",10],
["Spiderman Push-ups",10],
["Slow Push-ups",10]
];

let i=0;
let total=0;

let xp=+localStorage.getItem("push_xp")||0;
let done=JSON.parse(localStorage.getItem("push_done")||"{}");

const xpEl=document.getElementById("xp");
const levelEl=document.getElementById("level");
const streakEl=document.getElementById("streak");

const circle=document.getElementById("circle");
const percent=document.getElementById("percent");

function date(){
let d=new Date();
return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

function update(){
xpEl.innerText=xp;
levelEl.innerText=Math.floor(xp/100)+1;
streakEl.innerText=Object.keys(done).length;
}

function circleUpdate(){
let p=Math.min(total,100)/100;
circle.style.background=
`conic-gradient(#22c55e ${p*360}deg,#1e293b ${p*360}deg)`;

percent.innerText=`${total}/100`;
}

function renderCalendar(){

let cal=document.getElementById("calendar");
cal.innerHTML="";

let now=new Date();
let y=now.getFullYear();
let m=now.getMonth();

document.getElementById("month").innerText=
now.toLocaleString("default",{month:"long"})+" "+y;

["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].forEach(d=>{
let div=document.createElement("div");
div.className="day-name";
div.innerText=d;
cal.appendChild(div);
});

let first=new Date(y,m,1).getDay();
let days=new Date(y,m+1,0).getDate();

for(let i=0;i<first;i++){
cal.appendChild(document.createElement("div"));
}

let today=date();

for(let d=1;d<=days;d++){

let key=
`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;

let div=document.createElement("div");

div.className="day";

if(key===today){
div.classList.add("today");
}

if(done[key]){
div.classList.add(done[key]>1?"multi":"done");
div.innerText=done[key];
}else{
div.innerText=d;
}

cal.appendChild(div);
}
}

function render(){

if(i>=workout.length){

let t=date();

done[t]=(done[t]||0)+1;

localStorage.setItem("push_done",JSON.stringify(done));

xp+=50;

localStorage.setItem("push_xp",xp);

update();

renderCalendar();

total=100;

circleUpdate();

document.getElementById("exercise").innerText="Workout Complete!";

return;
}

document.getElementById("exercise").innerText=workout[i][0];

document.getElementById("reps").innerText=
workout[i][1]+" reps";

document.getElementById("setinfo").innerText=
`Set ${i+1}/${workout.length}`;

circleUpdate();
}

document.getElementById("btn").onclick=()=>{
total+=10;
i++;
render();
};

document.getElementById("resetBtn").onclick=()=>{
i=0;
total=0;
render();
};

update();
render();
renderCalendar();

});

</script>

</body>
</html>
