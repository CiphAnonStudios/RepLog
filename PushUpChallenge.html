<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RepLog - Push Challenge</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

:root{
  --bg:#0f0a07;
  --card:rgba(255,255,255,0.06);
  --stroke:rgba(255,255,255,0.08);
  --text:#fff;
  --muted:rgba(255,255,255,0.6);

  --green:#22c55e;
  --yellow:#eab308;
  --red:#ef4444;
  --purple:#a855f7;
  --black:#0a0a0a;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Poppins,sans-serif;
  background:radial-gradient(circle at top,#2a1a12,#0b0705 70%);
  color:var(--text);
  padding-bottom:80px;
}

/* TOP */
.top{
  display:flex;
  justify-content:space-between;
  padding:14px 16px;
  font-size:13px;
  color:var(--muted);
}

/* NAV */
.nav{
  display:flex;
  gap:10px;
  padding:0 16px;
}

.nav button{
  flex:1;
  padding:10px;
  border-radius:12px;
  border:1px solid var(--stroke);
  background:var(--card);
  color:white;
  font-weight:600;
}

/* MAIN CARD */
.card{
  margin:15px;
  padding:22px;
  border-radius:28px;
  background:linear-gradient(145deg,rgba(255,255,255,0.08),rgba(255,255,255,0.03));
  border:1px solid var(--stroke);
}

/* TIER BAR */
.tier{
  text-align:center;
  margin-top:10px;
  font-weight:700;
  letter-spacing:1px;
}

/* CIRCLE */
.circle{
  width:180px;
  height:180px;
  border-radius:50%;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:0.4s;
}

.inner{
  width:130px;
  height:130px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,0.35);
  border:1px solid var(--stroke);
  font-weight:600;
}

/* TEXT */
.exercise{
  text-align:center;
  font-size:22px;
  margin-top:14px;
}

.reps,.setinfo{
  text-align:center;
  color:var(--muted);
  font-size:13px;
}

button{
  width:100%;
  padding:14px;
  margin-top:10px;
  border:none;
  border-radius:14px;
  background:var(--green);
  font-weight:700;
}

.secondary{
  background:#334155;
}

/* COLORS (tier system) */
.beginner{ background:conic-gradient(var(--green) var(--p),#1e293b 0); }
.intermediate{ background:conic-gradient(var(--yellow) var(--p),#1e293b 0); }
.professional{ background:conic-gradient(var(--red) var(--p),#1e293b 0); }
.intense{ background:conic-gradient(var(--purple) var(--p),#1e293b 0); }
.elite{ background:conic-gradient(var(--black) var(--p),#1e293b 0); }

</style>
</head>

<body>

<div class="top">
<div>XP: <span id="xp">0</span></div>
<div>Lvl: <span id="level">1</span></div>
<div>🔥 <span id="streak">0</span></div>
</div>

<div class="nav">
<button onclick="show('main')">Workout</button>
<button onclick="show('profile')">Profile</button>
</div>

<div id="main">

<div class="card">

<div class="circle beginner" id="circle">
<div class="inner" id="percent">0/100</div>
</div>

<div class="tier" id="tierText">BEGINNER</div>

<div class="exercise" id="exercise">Ready?</div>
<div class="reps" id="reps"></div>
<div class="setinfo" id="setinfo"></div>

<button id="btn">Start</button>
<button class="secondary" id="resetBtn">Reset</button>

</div>

</div>

<div id="profile" style="display:none;padding:15px;">
<h2>Profile</h2>
<p>XP: <span id="p_xp"></span></p>
<p>Level: <span id="p_level"></span></p>
<p>Days: <span id="p_days"></span></p>
</div>

<script>

let i=0;
let repsDone=0;

let xp=+localStorage.getItem("xp")||0;
let completed=JSON.parse(localStorage.getItem("days")||"{}");

const workout=[
["Normal Push-ups",10],
["Wide Push-ups",10],
["Diamond Push-ups",10],
["Reverse Push-ups",10],
["Pike Push-ups",10],
["Decline Push-ups",10],
["Archer Push-ups",10],
["Explosive Push-ups",10],
["Spiderman Push-ups",10],
["Slow Push-ups",10]
];

const circle=document.getElementById("circle");
const percent=document.getElementById("percent");
const tierText=document.getElementById("tierText");

function getTier(){

if(xp<100) return ["beginner","BEGINNER",getComputedStyle(document.documentElement).getPropertyValue('--green')];
if(xp<250) return ["intermediate","INTERMEDIATE",getComputedStyle(document.documentElement).getPropertyValue('--yellow')];
if(xp<500) return ["professional","PROFESSIONAL",getComputedStyle(document.documentElement).getPropertyValue('--red')];
if(xp<1000) return ["intense","INTENSE",getComputedStyle(document.documentElement).getPropertyValue('--purple')];
return ["elite","ELITE",getComputedStyle(document.documentElement).getPropertyValue('--black')];

}

function updateCircle(){

let p=Math.min(repsDone,100)/100;
circle.style.setProperty("--p",`${p*360}deg`);

let tier=getTier();

circle.className="circle "+tier[0];
tierText.innerText=tier[1];

percent.innerText=repsDone+"/100";
}

function render(){

if(i>=workout.length){

let today=new Date().toISOString().split("T")[0];
completed[today]=(completed[today]||0)+1;

localStorage.setItem("days",JSON.stringify(completed));

xp+=50;
localStorage.setItem("xp",xp);

document.getElementById("xp").innerText=xp;
document.getElementById("level").innerText=Math.floor(xp/100)+1;
document.getElementById("streak").innerText=Object.keys(completed).length;

repsDone=100;
updateCircle();

document.getElementById("exercise").innerText="Complete!";
return;
}

document.getElementById("exercise").innerText=workout[i][0];
document.getElementById("reps").innerText=workout[i][1]+" reps";
document.getElementById("setinfo").innerText=`Set ${i+1}/${workout.length}`;

updateCircle();

}

document.getElementById("btn").onclick=()=>{
repsDone+=10;
i++;
render();
};

document.getElementById("resetBtn").onclick=()=>{
i=0;
repsDone=0;
render();
};

function show(id){
document.getElementById("main").style.display=id==="main"?"block":"none";
document.getElementById("profile").style.display=id==="profile"?"block":"none";
}

updateCircle();
render();

</script>

</body>
</html>
