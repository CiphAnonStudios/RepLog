<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>RepLog Push Challenge</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

:root{
  --bg:#0f0a07;
  --card:rgba(255,255,255,0.06);
  --stroke: rgba(255, 94, 98, 0.12);
  --text:#ffffff;
  --muted:rgba(255,255,255,0.65);
  --accent:#ff5e62;
  --accent2:#ff9966;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Poppins,sans-serif;
  background:
  radial-gradient(circle at top left,#2a1a12,#0b0705 60%);
  color:var(--text);
  overflow-x:hidden;
  padding-bottom:100px;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  background:
  radial-gradient(circle at 20% 20%, rgba(255,94,98,0.12), transparent 40%),
  radial-gradient(circle at 80% 30%, rgba(255,153,102,0.12), transparent 35%);
  z-index:-1;
}

/* NAV */
nav{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:18px;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:20px;
  font-weight:700;
  color:var(--accent);
}

.logo img{
  width:38px;
  height:38px;
  border-radius:12px;
}

/* HERO */
.hero{
  padding:10px 20px 20px;
}

.hero-card{
  background:linear-gradient(145deg,rgba(255,255,255,0.08),rgba(255,255,255,0.03));
  border:1px solid var(--stroke);
  border-radius:28px;
  padding:28px 22px;
  position:relative;
  overflow:hidden;
}

.hero-card::before{
  content:"";
  position:absolute;
  width:220px;
  height:220px;
  background:rgba(255,94,98,0.12);
  border-radius:50%;
  top:-120px;
  right:-80px;
}

.hero h1{
  font-size:38px;
  line-height:1;
  margin-bottom:12px;
}

.hero h1 span{
  color:var(--accent);
}

.hero p{
  color:var(--muted);
  font-size:15px;
  max-width:320px;
}

/* STATS */
.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  padding:0 20px;
  margin-top:10px;
}

.stat-card{
  background:var(--card);
  border:1px solid var(--stroke);
  border-radius:20px;
  padding:18px 12px;
  text-align:center;
  backdrop-filter:blur(12px);
}

.stat-card h2{
  color:var(--accent);
  font-size:22px;
}

.stat-card p{
  color:var(--muted);
  font-size:12px;
}

/* SECTION */
.section{
  padding:30px 20px 0;
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.section-title h2{
  font-size:22px;
}

.section-title span{
  color:var(--muted);
  font-size:13px;
}

/* CALENDAR */
.calendar-card{
  background:linear-gradient(145deg,rgba(255,255,255,0.08),rgba(255,255,255,0.03));
  border:1px solid var(--stroke);
  border-radius:24px;
  padding:20px;
}

#month{
  font-size:20px;
  font-weight:700;
  margin-bottom:18px;
  color:var(--accent);
}

#calendar{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:8px;
}

.day-name{
  text-align:center;
  font-size:11px;
  color:var(--muted);
  font-weight:600;
}

.day{
  aspect-ratio:1;
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(255,255,255,0.05);
  font-size:13px;
}

.today{
  border:2px solid var(--accent);
}

.done{
  background:linear-gradient(135deg,#ff9966,#ff5e62);
  color:white;
  font-weight:700;
}

.multi{
  background:linear-gradient(135deg,#ff5e62,#ff9966);
  color:white;
  font-weight:700;
}

/* WORKOUT */
.workout-card{
  margin-top:20px;
  background:linear-gradient(145deg,rgba(255,255,255,0.08),rgba(255,255,255,0.03));
  border:1px solid var(--stroke);
  border-radius:28px;
  padding:28px 22px;
  text-align:center;
}

.circle{
  width:180px;
  height:180px;
  border-radius:50%;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:0.4s;
  background:conic-gradient(var(--accent) 0deg,#1b1b1b 0deg);
}

.inner{
  width:135px;
  height:135px;
  border-radius:50%;
  background:#0f1115;
  border:1px solid var(--stroke);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  font-weight:700;
}

.exercise{
  font-size:28px;
  margin-top:24px;
  font-weight:700;
}

.reps{
  color:var(--muted);
  margin-top:6px;
  font-size:15px;
}

.setinfo{
  margin-top:10px;
  color:var(--accent);
  font-size:14px;
  font-weight:600;
}

/* BUTTONS */
.btn{
  width:100%;
  border:none;
  padding:16px;
  border-radius:18px;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
  margin-top:14px;
}

.primary-btn{
  background:linear-gradient(135deg,#ff9966,#ff5e62);
  color:white;
}

.secondary-btn{
  background:rgba(255,255,255,0.06);
  border:1px solid var(--stroke);
  color:white;
}

/* PROFILE */
.profile-card{
  margin-top:20px;
  background:linear-gradient(145deg,rgba(255,255,255,0.08),rgba(255,255,255,0.03));
  border:1px solid var(--stroke);
  border-radius:24px;
  padding:24px;
}

/* BOTTOM NAV */
.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:rgba(10,10,10,0.92);
  backdrop-filter:blur(20px);
  border-top:1px solid var(--stroke);
  display:flex;
  justify-content:space-around;
  padding:12px 0;
}

.bottom-nav a{
  color:var(--muted);
  text-decoration:none;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:5px;
  font-size:11px;
}

.bottom-nav i{
  font-size:20px;
}

.bottom-nav a.active{
  color:var(--accent);
}

footer{
  text-align:center;
  color:rgba(255,255,255,0.35);
  padding:35px 20px;
  font-size:12px;
}

</style>
</head>

<body>

<nav>
  <div class="logo">
    <img src="RepLogHeader.png">
    <span>RepLog</span>
  </div>
</nav>

<section class="hero">
  <div class="hero-card">
    <h1>Push <span>Challenge</span></h1>
    <p>Build upper body strength, endurance, and explosive power.</p>
  </div>
</section>

<section class="stats">
  <div class="stat-card"><h2 id="xp">0</h2><p>XP</p></div>
  <div class="stat-card"><h2 id="level">1</h2><p>LEVEL</p></div>
  <div class="stat-card"><h2 id="streak">0</h2><p>STREAK</p></div>
</section>

<section class="section">

  <div class="section-title">
    <h2>Calendar</h2>
    <span>Track Progress</span>
  </div>

  <div class="calendar-card">
    <div id="month"></div>
    <div id="calendar"></div>
  </div>

</section>

<section class="section">

  <div class="section-title">
    <h2>Workout</h2>
    <span>10 Sets</span>
  </div>

  <div class="workout-card">

    <div class="circle" id="circle">
      <div class="inner" id="percent">0/100</div>
    </div>

    <div class="exercise" id="exercise">Ready?</div>
    <div class="reps" id="reps"></div>
    <div class="setinfo" id="setinfo"></div>

    <button class="btn primary-btn" id="btn">Complete Set</button>
    <button class="btn secondary-btn" id="resetBtn">Reset</button>
    <button class="btn secondary-btn" id="resetProgressBtn">Reset Progress</button>

  </div>

</section>

<section class="section">

  <div class="profile-card">
    <h2>Profile</h2>
    <p>XP: <span id="p_xp"></span></p>
    <p>Level: <span id="p_level"></span></p>
    <p>Days: <span id="p_days"></span></p>
    <p>Streak: <span id="p_streak"></span></p>
  </div>

</section>

<footer>RepLog • Push System</footer>

<div class="bottom-nav">

<a href="home.html"><i class="fa-solid fa-house"></i>Home</a>
<a class="active"><i class="fa-solid fa-dumbbell"></i>Push</a>
<a href="CoreChallenge.html"><i class="fa-solid fa-fire"></i>Core</a>
<a href="CardioChallenge.html"><i class="fa-solid fa-bolt"></i>Cardio</a>
<a href="profile.html"><i class="fa-solid fa-user"></i>Profile</a>

</div>

<script>

document.addEventListener("DOMContentLoaded",()=>{

function getLocalDate(){
let d=new Date();
return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

const workout=[
["Push-ups",10],
["Wide Push-ups",10],
["Diamond Push-ups",10],
["Pike Push-ups",10],
["Decline Push-ups",10],
["Explosive Push-ups",10],
["Archer Push-ups",10],
["Slow Push-ups",10],
["Spiderman Push-ups",10],
["Reverse Hold Push-up",10]
];

let i=0;
let total=0;

let xp=+localStorage.getItem("push_xp")||0;
let done=JSON.parse(localStorage.getItem("push_done")||"{}");

const xpEl=document.getElementById("xp");
const levelEl=document.getElementById("level");
const streakEl=document.getElementById("streak");

const circle=document.getElementById("circle");
const percent=document.getElementById("percent");

const p_xp=document.getElementById("p_xp");
const p_level=document.getElementById("p_level");
const p_days=document.getElementById("p_days");
const p_streak=document.getElementById("p_streak");

function updateProfile(){
p_xp.innerText=xp;
p_level.innerText=Math.floor(xp/100)+1;
p_days.innerText=Object.keys(done).length;
p_streak.innerText=Object.keys(done).length;
}

function update(){
xpEl.innerText=xp;
levelEl.innerText=Math.floor(xp/100)+1;
streakEl.innerText=Object.keys(done).length;
updateProfile();
}

function circleUpdate(){
let p=Math.min(total,100)/100;
circle.style.background=`conic-gradient(#ff5e62 ${p*360}deg,#1a1a1a ${p*360}deg)`;
percent.innerText=`${total}/100`;
}

function renderCalendar(){
let cal=document.getElementById("calendar");
cal.innerHTML="";

let now=new Date();
let y=now.getFullYear();
let m=now.getMonth();

document.getElementById("month").innerText=
now.toLocaleString("default",{month:"long"})+" "+y;

["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].forEach(d=>{
let div=document.createElement("div");
div.className="day-name";
div.innerText=d;
cal.appendChild(div);
});

let first=new Date(y,m,1).getDay();
let days=new Date(y,m+1,0).getDate();

for(let i=0;i<first;i++) cal.appendChild(document.createElement("div"));

let today=getLocalDate();

for(let d=1;d<=days;d++){

let key=`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;

let div=document.createElement("div");
div.className="day";

if(key===today) div.classList.add("today");

if(done[key]){
div.classList.add(done[key]>1?"multi":"done");
div.innerText=done[key];
}else div.innerText=d;

cal.appendChild(div);
}
}

function render(){

if(i>=workout.length){

let t=getLocalDate();
done[t]=(done[t]||0)+1;

localStorage.setItem("push_done",JSON.stringify(done));

xp+=50;
localStorage.setItem("push_xp",xp);

update();
renderCalendar();

total=100;
circleUpdate();

document.getElementById("exercise").innerText="Complete!";
return;
}

document.getElementById("exercise").innerText=workout[i][0];
document.getElementById("reps").innerText=workout[i][1]+" reps";
document.getElementById("setinfo").innerText=`Set ${i+1}/${workout.length}`;

circleUpdate();
}

document.getElementById("btn").onclick=()=>{
total+=10;
i++;
render();
};

document.getElementById("resetBtn").onclick=()=>{
i=0;
total=0;
render();
};

update();
render();
renderCalendar();

});
</script>

</body>
</html>
