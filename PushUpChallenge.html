<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>RepLog - Push Challenge</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

:root{
  --bg:#0b0705;
  --card:rgba(255,255,255,0.06);
  --stroke:rgba(255,255,255,0.08);
  --text:#fff;
  --muted:rgba(255,255,255,0.6);
  --green:#00FF7F;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Poppins,sans-serif;
  background:radial-gradient(circle at top,#2a1a12,#0b0705 70%);
  color:white;
}

/* TOP BAR */
.top{
  display:flex;
  justify-content:space-between;
  padding:16px;
  font-size:13px;
  color:var(--muted);
}

/* NAV */
.nav{
  display:flex;
  gap:10px;
  padding:0 16px;
}

.nav button{
  flex:1;
  padding:10px;
  border-radius:14px;
  border:1px solid var(--stroke);
  background:var(--card);
  color:white;
  font-weight:600;
}

/* CALENDAR */
#calendar{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:6px;
  padding:10px 16px;
}

.day{
  aspect-ratio:1;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:10px;
  background:var(--card);
  font-size:12px;
}

.today{border:2px solid var(--green);}
.done{background:var(--green); color:black;}
.multi{background:#a855f7;color:white;}

/* MAIN CARD */
.card{
  margin:15px;
  padding:22px;
  border-radius:24px;
  background:linear-gradient(145deg,rgba(255,255,255,0.08),rgba(255,255,255,0.03));
  border:1px solid var(--stroke);
  text-align:center;
}

/* CIRCLE */
.circle{
  width:170px;
  height:170px;
  border-radius:50%;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:center;
  background:conic-gradient(var(--green) 0deg,#1e293b 0deg);
}

.inner{
  width:120px;
  height:120px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,0.35);
  border:1px solid var(--stroke);
}

/* TEXT */
.exercise{
  font-size:20px;
  margin-top:12px;
  font-weight:600;
}

.reps,.setinfo{
  font-size:13px;
  color:var(--muted);
}

/* BUTTONS */
button{
  width:100%;
  padding:14px;
  margin-top:10px;
  border:none;
  border-radius:14px;
  background:var(--green);
  font-weight:700;
}

.secondary{
  background:rgba(255,255,255,0.08);
  color:white;
  border:1px solid var(--stroke);
}

/* PROFILE */
.screen{display:none;}
.active{display:block;}

.profile{
  margin:15px;
  padding:20px;
}

</style>
</head>

<body>

<!-- TOP -->
<div class="top">
<div><i class="fa-solid fa-bolt"></i> XP: <span id="xp">0</span></div>
<div><i class="fa-solid fa-layer-group"></i> LVL: <span id="level">1</span></div>
<div><i class="fa-solid fa-fire"></i> <span id="streak">0</span></div>
</div>

<!-- NAV -->
<div class="nav">
<button onclick="showScreen('main')">Workout</button>
<button onclick="showScreen('profile')">Profile</button>
</div>

<!-- MAIN -->
<div id="main" class="screen active">

<div id="month"></div>
<div id="calendar"></div>

<div class="card">

<div class="circle" id="circle">
<div class="inner" id="percent">0/100</div>
</div>

<div class="exercise" id="exercise">Ready?</div>
<div class="reps" id="reps"></div>
<div class="setinfo" id="setinfo"></div>

<button id="btn">Start</button>
<button class="secondary" id="resetBtn">Reset</button>

</div>

<button class="secondary" id="resetProgressBtn">Reset Progress</button>

</div>

<!-- PROFILE -->
<div id="profile" class="screen card profile">
<h2>Profile</h2>
<p>XP: <span id="p_xp"></span></p>
<p>Level: <span id="p_level"></span></p>
<p>Days: <span id="p_days"></span></p>
<p>Streak: <span id="p_streak"></span></p>
</div>

<script>

document.addEventListener("DOMContentLoaded",()=>{

const workout=[
["Normal Push-ups",10],
["Wide Push-ups",10],
["Diamond Push-ups",10],
["Reverse Push-ups",10],
["Pike Push-ups",10],
["Decline Push-ups",10],
["Archer Push-ups",10],
["Explosive Push-ups",10],
["Spiderman Push-ups",10],
["Slow Push-ups",10]
];

let i=0,totalReps=0;

let xp=+localStorage.getItem("xp")||0;
let completedDays=JSON.parse(localStorage.getItem("completedDays")||"{}");

const xpEl=document.getElementById("xp");
const levelEl=document.getElementById("level");
const streakEl=document.getElementById("streak");

const exercise=document.getElementById("exercise");
const reps=document.getElementById("reps");
const setinfo=document.getElementById("setinfo");
const circle=document.getElementById("circle");
const percent=document.getElementById("percent");

const p_xp=document.getElementById("p_xp");
const p_level=document.getElementById("p_level");
const p_days=document.getElementById("p_days");
const p_streak=document.getElementById("p_streak");

function date(){
let d=new Date();
return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

function updateStats(){
xpEl.innerText=xp;
levelEl.innerText=Math.floor(xp/100)+1;
streakEl.innerText=Object.keys(completedDays).length;
}

function updateProfile(){
p_xp.innerText=xp;
p_level.innerText=Math.floor(xp/100)+1;
p_days.innerText=Object.keys(completedDays).length;
p_streak.innerText=Object.keys(completedDays).length;
}

function updateCircle(){
let p=Math.min(totalReps,100)/100;
circle.style.background=`conic-gradient(#00FF7F ${p*360}deg,#1e293b ${p*360}deg)`;
percent.innerText=totalReps+"/100";
}

function render(){
if(i>=workout.length){
let t=date();
completedDays[t]=(completedDays[t]||0)+1;
localStorage.setItem("completedDays",JSON.stringify(completedDays));

xp+=50;
localStorage.setItem("xp",xp);

updateStats();
renderCalendar();

exercise.innerText="Complete!";
totalReps=100;
updateCircle();
return;
}

exercise.innerText=workout[i][0];
reps.innerText=workout[i][1]+" reps";
setinfo.innerText=`Set ${i+1}/${workout.length}`;
updateCircle();
}

document.getElementById("btn").onclick=()=>{
totalReps+=10;
i++;
render();
};

document.getElementById("resetBtn").onclick=()=>{
i=0;
totalReps=0;
render();
};

function renderCalendar(){
const cal=document.getElementById("calendar");
cal.innerHTML="";

let now=new Date();
let y=now.getFullYear();
let m=now.getMonth();

document.getElementById("month").innerText=
now.toLocaleString("default",{month:"long"})+" "+y;

let first=new Date(y,m,1).getDay();
let days=new Date(y,m+1,0).getDate();

for(let i=0;i<first;i++)cal.appendChild(document.createElement("div"));

let today=date();

for(let d=1;d<=days;d++){
let ds=`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
let div=document.createElement("div");
div.className="day";

if(ds===today)div.classList.add("today");

if(completedDays[ds]){
div.classList.add(completedDays[ds]>1?"multi":"done");
div.innerText=completedDays[ds];
}else div.innerText=d;

cal.appendChild(div);
}
}

window.showScreen=(id)=>{
document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
document.getElementById(id).classList.add("active");
updateProfile();
};

document.getElementById("resetProgressBtn").onclick=()=>{
if(confirm("Reset all progress?")){
localStorage.clear();
xp=0;
completedDays={};
i=0;
totalReps=0;
updateStats();
render();
renderCalendar();
}
};

updateStats();
render();
renderCalendar();

});

</script>

</body>
</html>
