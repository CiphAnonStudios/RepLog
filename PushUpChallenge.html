<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>RepLog - Push</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

:root{
  --bg:#0f0a07;
  --card:rgba(255,255,255,0.06);
  --stroke:rgba(255,255,255,0.08);
  --text:#ffffff;
  --muted:rgba(255,255,255,0.65);
  --accent:#d6a15f;
  --accent2:#8f5cff;
  --green:#22c55e;
  --purple:#a855f7;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Poppins,sans-serif;
  background:radial-gradient(circle at top left,#2a1a12,#0b0705 60%);
  color:var(--text);
  padding-bottom:90px;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 20% 20%, rgba(214,161,95,0.10), transparent 40%),
    radial-gradient(circle at 80% 30%, rgba(143,92,255,0.10), transparent 35%);
  z-index:-1;
}

/* TOP */
.top{
  display:flex;
  justify-content:space-between;
  padding:18px;
  color:var(--muted);
  font-size:13px;
}

/* MONTH */
#month{
  padding:0 18px;
  font-size:18px;
  font-weight:600;
}

/* CALENDAR */
#calendar{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:6px;
  padding:10px 18px;
}

.day-name{
  font-size:10px;
  text-align:center;
  opacity:0.5;
}

.day{
  aspect-ratio:1;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:10px;
  background:var(--card);
  font-size:12px;
}

.today{
  border:1px solid var(--green);
}

.done{
  background:var(--green);
  color:black;
}

.multi{
  background:var(--purple);
  color:white;
}

/* MAIN CARD */
.card{
  margin:16px;
  padding:22px;
  border-radius:26px;
  background:linear-gradient(145deg,rgba(255,255,255,0.08),rgba(255,255,255,0.03));
  border:1px solid var(--stroke);
  text-align:center;
}

/* CIRCLE */
.circle{
  width:170px;
  height:170px;
  border-radius:50%;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:center;
  background:conic-gradient(var(--green) 0deg,#1e293b 0deg);
}

.inner{
  width:125px;
  height:125px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,0.35);
  border:1px solid var(--stroke);
  font-weight:600;
}

/* TEXT */
.exercise{
  font-size:20px;
  margin-top:12px;
  font-weight:600;
}

.reps,.setinfo{
  font-size:13px;
  color:var(--muted);
}

/* BUTTONS */
button{
  width:100%;
  margin-top:10px;
  padding:14px;
  border:none;
  border-radius:14px;
  background:var(--green);
  font-weight:700;
}

.secondary{
  background:rgba(255,255,255,0.08);
  color:white;
  border:1px solid var(--stroke);
}

/* BOTTOM NAV (MATCH HOME PAGE EXACTLY) */
.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:rgba(10,10,10,0.92);
  backdrop-filter:blur(20px);
  border-top:1px solid var(--stroke);
  display:flex;
  justify-content:space-around;
  padding:12px 0;
}

.bottom-nav a{
  color:var(--muted);
  text-decoration:none;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:5px;
  font-size:11px;
}

.bottom-nav i{
  font-size:20px;
}

.bottom-nav a.active{
  color:var(--accent);
}

</style>
</head>

<body>

<!-- TOP -->
<div class="top">
<div>XP: <span id="xp">0</span></div>
<div>Lvl: <span id="level">1</span></div>
<div>🔥 <span id="streak">0</span></div>
</div>

<!-- MONTH -->
<div id="month"></div>
<div id="calendar"></div>

<!-- WORKOUT -->
<div class="card">

<div class="circle" id="circle">
<div class="inner" id="percent">0/100</div>
</div>

<div class="exercise" id="exercise">Ready?</div>
<div class="reps" id="reps"></div>
<div class="setinfo" id="setinfo"></div>

<button id="btn">Start</button>
<button class="secondary" id="resetBtn">Reset</button>

</div>

<!-- LEGEND -->
<div class="card">
<p style="color:var(--muted);font-size:13px;">
green = completed once (100 reps)<br>
purple = completed multiple days
</p>
</div>

<!-- BOTTOM NAV (SAME STYLE AS HOME PAGE) -->
<div class="bottom-nav">

<a href="index.html">
<i class="fa-solid fa-house"></i>
Home
</a>

<a class="active" href="#">
<i class="fa-solid fa-dumbbell"></i>
Push
</a>

<a href="#">
<i class="fa-solid fa-fire"></i>
Core
</a>

<a href="#">
<i class="fa-solid fa-bolt"></i>
Cardio
</a>

<a href="profile.html">
<i class="fa-solid fa-user"></i>
Profile
</a>

</div>

<script>

document.addEventListener("DOMContentLoaded",()=>{

const workout=[
["Normal Push-ups",10],
["Wide Push-ups",10],
["Diamond Push-ups",10],
["Reverse Push-ups",10],
["Pike Push-ups",10],
["Decline Push-ups",10],
["Archer Push-ups",10],
["Explosive Push-ups",10],
["Spiderman Push-ups",10],
["Slow Push-ups",10]
];

let i=0;
let total=0;

let xp=+localStorage.getItem("xp")||0;
let done=JSON.parse(localStorage.getItem("done")||"{}");

const xpEl=document.getElementById("xp");
const levelEl=document.getElementById("level");
const streakEl=document.getElementById("streak");

const circle=document.getElementById("circle");
const percent=document.getElementById("percent");

function date(){
let d=new Date();
return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

function update(){
xpEl.innerText=xp;
levelEl.innerText=Math.floor(xp/100)+1;
streakEl.innerText=Object.keys(done).length;
}

function circleUpdate(){
let p=Math.min(total,100)/100;
circle.style.background=`conic-gradient(#22c55e ${p*360}deg,#1e293b ${p*360}deg)`;
percent.innerText=`${total}/100`;
}

/* CALENDAR */
function renderCalendar(){
let cal=document.getElementById("calendar");
cal.innerHTML="";

let now=new Date();
let y=now.getFullYear();
let m=now.getMonth();

document.getElementById("month").innerText=
now.toLocaleString("default",{month:"long"})+" "+y;

/* days row */
["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].forEach(d=>{
let div=document.createElement("div");
div.className="day-name";
div.innerText=d;
cal.appendChild(div);
});

let first=new Date(y,m,1).getDay();
let days=new Date(y,m+1,0).getDate();

for(let i=0;i<first;i++) cal.appendChild(document.createElement("div"));

let today=date();

for(let d=1;d<=days;d++){
let key=`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;

let div=document.createElement("div");
div.className="day";

if(key===today) div.classList.add("today");

if(done[key]){
div.classList.add(done[key]>1?"multi":"done");
div.innerText=done[key];
}else div.innerText=d;

cal.appendChild(div);
}
}

function render(){

if(i>=workout.length){
let t=date();
done[t]=(done[t]||0)+1;
localStorage.setItem("done",JSON.stringify(done));

xp+=50;
localStorage.setItem("xp",xp);

update();
renderCalendar();

total=100;
circleUpdate();

document.getElementById("exercise").innerText="Complete!";
return;
}

document.getElementById("exercise").innerText=workout[i][0];
document.getElementById("reps").innerText=workout[i][1]+" reps";
document.getElementById("setinfo").innerText=`Set ${i+1}/${workout.length}`;

circleUpdate();
}

document.getElementById("btn").onclick=()=>{
total+=10;
i++;
render();
};

document.getElementById("resetBtn").onclick=()=>{
i=0;
total=0;
render();
};

update();
render();
renderCalendar();

});

</script>

</body>
</html>
