<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RepLog</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0b0705;
  --glass:rgba(255,255,255,0.06);
  --stroke:rgba(255,255,255,0.1);
  --text:#fff;
  --muted:rgba(255,255,255,0.6);
  --green:#00FF7F;
  --purple:#a855f7;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Poppins,sans-serif;
  background:radial-gradient(circle at top,#2a1a12,#0b0705 70%);
  color:var(--text);
}

.container{
  max-width:520px;
  margin:auto;
  padding:15px;
}

/* GLASS */
.glass{
  background:var(--glass);
  backdrop-filter:blur(18px);
  border:1px solid var(--stroke);
  border-radius:22px;
  box-shadow:0 10px 35px rgba(0,0,0,0.4);
}

/* TOP BAR */
.top{
  display:flex;
  justify-content:space-between;
  padding:14px 16px;
  margin-bottom:12px;
  font-size:13px;
  color:var(--muted);
}

/* NAV */
.nav{
  display:flex;
  gap:10px;
  margin-bottom:12px;
}

.nav button{
  flex:1;
  padding:10px;
  border:none;
  border-radius:14px;
  background:var(--glass);
  color:white;
  font-weight:600;
}

/* CALENDAR */
#calendar{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:6px;
  margin-bottom:15px;
}

.day-name{
  font-size:10px;
  opacity:0.6;
  text-align:center;
}

.day{
  aspect-ratio:1;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:10px;
  font-size:12px;
  background:var(--glass);
  transition:0.2s;
}

.day:hover{
  transform:scale(1.05);
}

.today{
  border:2px solid var(--green);
}

.done{
  background:var(--green);
  color:black;
}

.multi{
  background:var(--purple);
  color:white;
}

/* MAIN CARD */
.card{
  padding:22px;
  text-align:center;
  margin-bottom:10px;
}

/* CIRCLE */
.circle{
  width:170px;
  height:170px;
  border-radius:50%;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:center;
  background:conic-gradient(var(--green) 0deg,#1e293b 0deg);
}

.inner{
  width:125px;
  height:125px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,0.3);
  border:1px solid var(--stroke);
  font-weight:600;
}

/* TEXT */
.exercise{
  font-size:20px;
  font-weight:600;
  margin-top:12px;
}

.reps,.setinfo{
  font-size:13px;
  opacity:0.6;
}

.timer{
  font-size:28px;
  margin-top:8px;
}

/* BUTTONS */
button{
  width:100%;
  padding:14px;
  margin-top:10px;
  border:none;
  border-radius:14px;
  background:var(--green);
  font-weight:700;
}

.secondary{
  background:#334155;
  color:white;
}

/* PROFILE */
.screen{display:none;}
.active{display:block;}

.profile{
  margin-top:15px;
  padding:20px;
}
</style>
</head>

<body>

<div class="container">

<!-- TOP -->
<div class="top glass">
<div>XP: <span id="xp">0</span></div>
<div>Lvl: <span id="level">1</span></div>
<div>🔥 <span id="streak">0</span></div>
</div>

<!-- NAV -->
<div class="nav">
<button onclick="showScreen('main')">Workout</button>
<button onclick="showScreen('profile')">Profile</button>
</div>

<!-- MAIN -->
<div id="main" class="screen active">

<div id="month"></div>
<div id="calendar"></div>

<div class="card glass">

<div class="circle" id="circle">
<div class="inner" id="percent">0/100</div>
</div>

<div class="exercise" id="exercise">Ready?</div>
<div class="reps" id="reps"></div>
<div class="setinfo" id="setinfo"></div>

<button id="btn">Start</button>
<button class="secondary" id="resetBtn">Reset</button>

</div>

<button class="secondary" id="resetProgressBtn">Reset Progress</button>

</div>

<!-- PROFILE -->
<div id="profile" class="screen glass card profile">
<h2>Profile</h2>
<p>XP: <span id="p_xp"></span></p>
<p>Level: <span id="p_level"></span></p>
<p>Days: <span id="p_days"></span></p>
<p>Streak: <span id="p_streak"></span></p>
</div>

</div>

<script>
document.addEventListener("DOMContentLoaded",()=>{

const workout=[
["Normal Push-ups",10],
["Wide Push-ups",10],
["Diamond Push-ups",10],
["Reverse Push-ups",10],
["Pike Push-ups",10],
["Decline Push-ups",10],
["Archer Push-ups",10],
["Explosive Push-ups",10],
["Spiderman Push-ups",10],
["Slow Push-ups",10]
];

let i=0,totalReps=0;

let xp=+localStorage.getItem("xp")||0;
let completedDays=JSON.parse(localStorage.getItem("completedDays")||"{}");

const xpEl=document.getElementById("xp");
const levelEl=document.getElementById("level");
const streakEl=document.getElementById("streak");

const exercise=document.getElementById("exercise");
const reps=document.getElementById("reps");
const setinfo=document.getElementById("setinfo");
const circle=document.getElementById("circle");
const percent=document.getElementById("percent");
const calendar=document.getElementById("calendar");

const p_xp=document.getElementById("p_xp");
const p_level=document.getElementById("p_level");
const p_days=document.getElementById("p_days");
const p_streak=document.getElementById("p_streak");

function date(){
let d=new Date();
return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

function updateStats(){
xpEl.innerText=xp;
levelEl.innerText=Math.floor(xp/100)+1;
streakEl.innerText=Object.keys(completedDays).length;
}

function updateProfile(){
p_xp.innerText=xp;
p_level.innerText=Math.floor(xp/100)+1;
p_days.innerText=Object.keys(completedDays).length;
p_streak.innerText=Object.keys(completedDays).length;
}

function updateCircle(){
let p=Math.min(totalReps,100)/100;
circle.style.background=`conic-gradient(#00FF7F ${p*360}deg,#1e293b ${p*360}deg)`;
percent.innerText=totalReps+"/100";
}

function render(){
if(i>=workout.length){
let t=date();
completedDays[t]=(completedDays[t]||0)+1;
localStorage.setItem("completedDays",JSON.stringify(completedDays));
xp+=50;
localStorage.setItem("xp",xp);
updateStats();
renderCalendar();
exercise.innerText="Complete!";
totalReps=100;
updateCircle();
return;
}

exercise.innerText=workout[i][0];
reps.innerText=workout[i][1]+" reps";
setinfo.innerText=`Set ${i+1}/${workout.length}`;
updateCircle();
}

document.getElementById("btn").onclick=()=>{
totalReps+=10;
i++;
render();
};

document.getElementById("resetBtn").onclick=()=>{
i=0;
totalReps=0;
render();
};

function renderCalendar(){
calendar.innerHTML="";
let now=new Date();
let y=now.getFullYear();
let m=now.getMonth();

document.getElementById("month").innerText=
now.toLocaleString("default",{month:"long"})+" "+y;

let first=new Date(y,m,1).getDay();
let days=new Date(y,m+1,0).getDate();

for(let i=0;i<first;i++)calendar.appendChild(document.createElement("div"));

let today=date();

for(let d=1;d<=days;d++){
let dStr=`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
let div=document.createElement("div");
div.className="day";

if(dStr===today)div.classList.add("today");
if(completedDays[dStr]){
div.classList.add(completedDays[dStr]>1?"multi":"done");
div.innerText=completedDays[dStr];
}else div.innerText=d;

calendar.appendChild(div);
}
}

window.showScreen=(id)=>{
document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
document.getElementById(id).classList.add("active");
updateProfile();
};

document.getElementById("resetProgressBtn").onclick=()=>{
if(confirm("Reset all progress?")){
localStorage.clear();
xp=0;
completedDays={};
i=0;
totalReps=0;
updateStats();
render();
renderCalendar();
}
};

updateStats();
render();
renderCalendar();

});
</script>

</body>
</html>
