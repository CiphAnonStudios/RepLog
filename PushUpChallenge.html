<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RepLog - Push Challenge</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

:root{
  --bg:#0f0a07;
  --card:rgba(255,255,255,0.06);
  --stroke:rgba(255,255,255,0.08);
  --text:#fff;
  --muted:rgba(255,255,255,0.6);

  --green:#22c55e;
  --yellow:#eab308;
  --red:#ef4444;
  --purple:#a855f7;
  --black:#111;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Poppins,sans-serif;
  background:radial-gradient(circle at top,#2a1a12,#0b0705 70%);
  color:var(--text);
  padding-bottom:80px;
}

/* TOP BAR */
.top{
  display:flex;
  justify-content:space-between;
  padding:14px 16px;
  font-size:13px;
  color:var(--muted);
}

/* NAV */
.nav{
  display:flex;
  gap:10px;
  padding:0 16px;
  margin-bottom:10px;
}

.nav button{
  flex:1;
  padding:10px;
  border-radius:12px;
  border:1px solid var(--stroke);
  background:var(--card);
  color:white;
  font-weight:600;
}

/* CARD (MATCH OTHER PAGES) */
.card{
  margin:15px;
  padding:22px;
  border-radius:26px;
  background:linear-gradient(145deg,rgba(255,255,255,0.08),rgba(255,255,255,0.03));
  border:1px solid var(--stroke);
}

/* CIRCLE */
.circle{
  width:170px;
  height:170px;
  border-radius:50%;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:0.3s;
  background:conic-gradient(var(--green) 0deg,#1e293b 0deg);
}

.inner{
  width:125px;
  height:125px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,0.35);
  border:1px solid var(--stroke);
  font-weight:600;
}

/* TEXT */
.exercise{
  text-align:center;
  font-size:22px;
  margin-top:15px;
}

.reps,.setinfo{
  text-align:center;
  color:var(--muted);
  font-size:13px;
}

/* BUTTONS */
button{
  width:100%;
  padding:14px;
  margin-top:10px;
  border:none;
  border-radius:14px;
  font-weight:700;
  background:var(--green);
}

.secondary{
  background:#334155;
}

/* TIER TEXT */
.tier{
  text-align:center;
  margin-top:10px;
  font-weight:700;
  letter-spacing:1px;
}

/* TIER COLORS (ONLY VISUAL CHANGE) */
.beginner .circle{ background:conic-gradient(var(--green) var(--p,0deg),#1e293b 0);}
.intermediate .circle{ background:conic-gradient(var(--yellow) var(--p,0deg),#1e293b 0);}
.professional .circle{ background:conic-gradient(var(--red) var(--p,0deg),#1e293b 0);}
.intense .circle{ background:conic-gradient(var(--purple) var(--p,0deg),#1e293b 0);}
.elite .circle{ background:conic-gradient(var(--black) var(--p,0deg),#1e293b 0);}

</style>
</head>

<body>

<div class="top">
<div>XP: <span id="xp">0</span></div>
<div>Lvl: <span id="level">1</span></div>
<div>🔥 <span id="streak">0</span></div>
</div>

<div class="nav">
<button onclick="show('main')">Workout</button>
<button onclick="show('profile')">Profile</button>
</div>

<div id="main">

<div class="card">

<div id="tierWrap" class="beginner">

<div class="circle" id="circle">
<div class="inner" id="percent">0/100</div>
</div>

</div>

<div class="tier" id="tierText">BEGINNER</div>

<div class="exercise" id="exercise">Ready?</div>
<div class="reps" id="reps"></div>
<div class="setinfo" id="setinfo"></div>

<button id="btn">Start</button>
<button class="secondary" id="resetBtn">Reset Set</button>

</div>

</div>

<div id="profile" style="display:none;padding:15px;">
<h2>Profile</h2>
<p>XP: <span id="p_xp"></span></p>
<p>Level: <span id="p_level"></span></p>
<p>Days: <span id="p_days"></span></p>
</div>

<script>

let i=0;
let reps=0;

let xp=+localStorage.getItem("xp")||0;
let days=JSON.parse(localStorage.getItem("days")||"{}");

const workout=[
["Normal Push-ups",10],
["Wide Push-ups",10],
["Diamond Push-ups",10],
["Reverse Push-ups",10],
["Pike Push-ups",10],
["Decline Push-ups",10],
["Archer Push-ups",10],
["Explosive Push-ups",10],
["Spiderman Push-ups",10],
["Slow Push-ups",10]
];

function getTier(){

if(xp<100) return "beginner";
if(xp<250) return "intermediate";
if(xp<500) return "professional";
if(xp<1000) return "intense";
return "elite";

}

function updateCircle(){

let p=Math.min(reps,100)/100;
document.getElementById("circle")
.style.setProperty("--p",`${p*360}deg`);

let tier=getTier();

document.getElementById("tierWrap").className=tier;

document.getElementById("percent").innerText=reps+"/100";

document.getElementById("tierText").innerText=
tier.toUpperCase();

}

function render(){

if(i>=workout.length){

let today=new Date().toISOString().split("T")[0];
days[today]=(days[today]||0)+1;
localStorage.setItem("days",JSON.stringify(days));

xp+=50;
localStorage.setItem("xp",xp);

document.getElementById("xp").innerText=xp;
document.getElementById("level").innerText=Math.floor(xp/100)+1;
document.getElementById("streak").innerText=Object.keys(days).length;

reps=100;
updateCircle();

document.getElementById("exercise").innerText="Complete!";
return;
}

document.getElementById("exercise").innerText=workout[i][0];
document.getElementById("reps").innerText=workout[i][1]+" reps";
document.getElementById("setinfo").innerText=`Set ${i+1}/${workout.length}`;

updateCircle();

}

document.getElementById("btn").onclick=()=>{
reps+=10;
i++;
render();
};

document.getElementById("resetBtn").onclick=()=>{
i=0;
reps=0;
render();
};

function show(id){
document.getElementById("main").style.display=id==="main"?"block":"none";
document.getElementById("profile").style.display=id==="profile"?"block":"none";
}

updateCircle();
render();

</script>

</body>
</html>
