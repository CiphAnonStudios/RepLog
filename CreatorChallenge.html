<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Summer Glow-Up Tracker</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
:root{
  --bg:#0f0a07;
  --card:rgba(255,255,255,0.06);
  --stroke:rgba(255,255,255,0.08);
  --text:#ffffff;
  --muted:rgba(255,255,255,0.65);
  --accent:#ff3c3c;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:Poppins,sans-serif;
  background:radial-gradient(circle at top left,#1a1111,#090909 60%);
  color:var(--text);
  overflow-x:hidden;
  padding-bottom:100px;
}

nav{
  display:flex;
  justify-content:space-between;
  padding:18px;
}

.workout-card{
  margin-top:20px;
  background:rgba(255,255,255,0.06);
  border:1px solid var(--stroke);
  border-radius:28px;
  padding:28px 22px;
  text-align:center;
}

.circle{
  width:180px;height:180px;border-radius:50%;
  margin:auto;
  display:flex;align-items:center;justify-content:center;
  background:conic-gradient(var(--accent) 0deg,#1b1b1b 0deg);
}

.inner{
  width:135px;height:135px;border-radius:50%;
  background:#0f1115;
  display:flex;align-items:center;justify-content:center;
  font-size:26px;font-weight:700;
}

.exercise{font-size:26px;margin-top:20px;font-weight:700;}
.reps{color:var(--muted);}
.setinfo{color:var(--accent);margin-top:10px;}

.btn{
  width:100%;
  padding:16px;
  border-radius:18px;
  border:none;
  margin-top:10px;
}

.primary-btn{background:linear-gradient(135deg,#ff3c3c,#8b0000);color:white;}
.secondary-btn{background:rgba(255,255,255,0.08);color:white;}

</style>
</head>

<body>

<nav>
  <div class="logo"><i class="fa-solid fa-fire"></i> GlowUp</div>
  <div id="menu">•••</div>
</nav>

<section class="workout-card">

<div class="circle" id="circle">
  <div class="inner" id="percent">0%</div>
</div>

<div class="exercise" id="exercise">Ready?</div>
<div class="reps" id="reps"></div>
<div class="setinfo" id="setinfo"></div>

<button class="btn primary-btn" id="btn">Complete Exercise</button>
<button class="btn secondary-btn" id="resetBtn">Reset</button>

</section>

<script>
document.addEventListener("DOMContentLoaded",()=>{

// ---------------- ORIGINAL WORKOUT (KEPT) ----------------
const workout=[
["Push-ups",10],
["Wide Push-ups",10],
["Diamond Push-ups",10],
["Pike Push-ups",15],
["Decline Push-ups",10],
["Explosive Push-ups",10],
["Archer Push-ups",10],
["Slow Push-ups",10],
["Sphinx Push-ups",5],
["Sudo Push-up",10],
["Preacher Curls",40],
["Dips",25],
["Wrist Curls",30],
["Pull-ups / Chin-ups",10],
["Inverted Rows",15],
["Backpack Rows",15],
["Resistance Band Rows",15],
["Squats",25],
["Bulgarian Split Squats",10],
["Calf Raises",30],
["Sit-Ups",50],
["Hollow Hold",10],
["Russian Twists",20],
["Leg Raises",15],
["Shoulder Taps",20],
["Bicycle Crunches",20],
["V-Ups",15],
["Flutter Kicks",20],
["Side Plank Dips",15],
["Mountain Climbers",20],
["Plank",60],
["Side Plank",30],
["Dead Hangs",60],
["Basketball",60],
["chin tucks",50]
];

// ---------------- MODES ----------------
const days={
workout:workout,
recovery:[
["Light Walk",30],
["Stretching",10],
["Easy Push-ups",8],
["Easy Squats",10],
["Plank",30]
],
break:[
["Normal Day",0]
]
};

const weeklyPlan=[
"workout","recovery","break",
"workout","recovery","workout","break"
];

function getTodayMode(){
return weeklyPlan[new Date().getDay()];
}

let currentMode=getTodayMode();
let currentList=days[currentMode];
let index=0;

// ---------------- STORAGE ----------------
let xp=+localStorage.getItem("xp")||0;
let workoutsDone=+localStorage.getItem("done")||0;

let completed=JSON.parse(localStorage.getItem("days")||"{}");

// ---------------- UI ----------------
const exercise=document.getElementById("exercise");
const reps=document.getElementById("reps");
const setinfo=document.getElementById("setinfo");
const percent=document.getElementById("percent");
const circle=document.getElementById("circle");

// ---------------- RENDER ----------------
function render(){

currentList=days[currentMode];

if(index>=currentList.length){

let today=new Date().toISOString().split("T")[0];

completed[today]=currentMode;

localStorage.setItem("days",JSON.stringify(completed));

xp+=100;
workoutsDone++;

localStorage.setItem("xp",xp);
localStorage.setItem("done",workoutsDone);

exercise.innerText="Complete!";
reps.innerText="";
setinfo.innerText="Good work";

return;
}

let item=currentList[index];

exercise.innerText=item[0];

reps.innerText=
item[1]==0 ? "" :
item[0]==="Basketball" ? item[1]+" min" :
item[1]+" reps";

setinfo.innerText=`${index+1}/${currentList.length}`;

let progress=(index/currentList.length)*100;

circle.style.background=
`conic-gradient(#ff3c3c ${progress*3.6}deg,#1b1b1b 0deg)`;

percent.innerText=Math.floor(progress)+"%";
}

// ---------------- BUTTONS ----------------
document.getElementById("btn").onclick=()=>{
index++;
render();
};

document.getElementById("resetBtn").onclick=()=>{
index=0;
render();
};

// ---------------- SWIPE ----------------
let startX=0;

document.addEventListener("touchstart",e=>{
startX=e.touches[0].clientX;
});

document.addEventListener("touchend",e=>{
let endX=e.changedTouches[0].clientX;

if(endX-startX>50){
changeMode(-1);
}
if(startX-endX>50){
changeMode(1);
}
});

function changeMode(dir){
let modes=["workout","recovery","break"];
let i=modes.indexOf(currentMode);

i+=dir;

if(i<0)i=2;
if(i>2)i=0;

currentMode=modes[i];
index=0;
render();
}

// ---------------- MENU ----------------
document.getElementById("menu").onclick=()=>{
let modes=["workout","recovery","break"];
let i=modes.indexOf(currentMode);
currentMode=modes[(i+1)%3];
index=0;
render();
};

// ---------------- START ----------------
render();

});
</script>

</body>
</html>
